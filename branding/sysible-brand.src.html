<!doctype html><html><head><meta charset="utf-8"><style>
  @font-face{font-family:"Sora";font-style:normal;font-weight:100 800;font-display:swap;
    src:url("../fonts/Sora-variable.woff2") format("woff2"),url("../fonts/Sora.ttf") format("truetype");}
  html,body{margin:0;padding:0;background:#222}
  .stage{position:relative;overflow:hidden;
    font-family:"Sora","Liberation Sans","DejaVu Sans","Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .dark{background:radial-gradient(120% 120% at 50% 34%, #141b27 0%, #0d1117 56%, #090c12 100%);}
  .word{font-weight:700;color:#eceff3;line-height:1;margin:0}
  .tag{font-weight:600;color:#8a93a0;text-transform:uppercase;margin:0}
  .uline{height:6px;border-radius:3px;background:#6ddb73;margin:20px 0 0}

  /* profile avatar 1024², padded so it reads small / survives a circle crop.
     This is the SES company lockup, stacked. It used to be the Sysible "S"
     tile over the word "Sysible" — which is not what has been live on the
     GitHub org for some time, because the live avatar was composed by hand
     somewhere else and never came back to this file. There was no script to
     re-render with, so nothing could catch the drift. There is one now. */
  #profile{width:1024px;height:1024px}
  #profile .ses{font-weight:800;color:#eceff3;font-size:250px;letter-spacing:-11px;line-height:1;margin:0}
  #profile .uline{width:300px;height:24px;margin:34px 0 0}
  /* nowrap and a tagline sized to stay inside the INSCRIBED CIRCLE, not the
     square. The first attempt used the card's 50px/17px tracking, which is
     ~1300px of text in a 1024px box: it wrapped to two lines and the circular
     crop GitHub applies then sliced the second one in half. Roughly 690px is
     the widest a line can be here and still clear the crop. */
  #profile .tag{font-size:28px;letter-spacing:8px;margin:34px 0 0 8px;white-space:nowrap}

  /* horizontal company lockup, 980×260, transparent — README banners.
     Proportions are the site header's lockup at 4.5x: 23/2x27/12/9@1.7. */
  .lockup{width:980px;height:260px;background:transparent;
          flex-direction:row;align-items:center;justify-content:center;gap:45px}
  .lockup .ses{font-weight:800;font-size:103.5px;letter-spacing:-4.5px;line-height:1;margin:0}
  .lockup .rule{width:9px;height:121.5px;border-radius:4.5px;background:#6ddb73}
  .lockup .stack{display:flex;flex-direction:column;line-height:1.08;text-align:left;gap:9px}
  .lockup .l1{font-weight:700;font-size:54px;letter-spacing:1.8px;text-transform:uppercase;margin:0}
  .lockup .l2{font-weight:600;font-size:40.5px;letter-spacing:7.65px;text-transform:uppercase;margin:0}
  #lockup-dark .ses,#lockup-dark .l1{color:#e9f0f7} #lockup-dark .l2{color:#8a93a0}
  #lockup-light .ses,#lockup-light .l1{color:#141d38} #lockup-light .l2{color:#5b6573}

  /* social cards 1280×640 */
  .card{width:1280px;height:640px}
  .card .mark{width:238px;height:258px;display:block;margin-bottom:22px}
  .card .word{font-size:118px;letter-spacing:-2px}
  .card .uline{width:200px}
  .card .tag{margin-top:22px}
  #sysible-card .tag{font-size:40px;letter-spacing:16px;margin-left:16px}
  #controller-card .word{font-size:104px}
  #controller-card .uline{width:300px}
  #controller-card .tag{font-size:35px;letter-spacing:11px;margin-left:11px}
  .bar{position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,#6ddb73 0%,#6ddb73 72%,#7aa2ff 100%)}
</style></head><body>

<!-- reusable mark defs (dark tile + green ring; "S" = Sora outline, ctrl = hub-nodes) -->

  <g id="mc"><rect x="-23" y="-25" width="46" height="50" rx="12" fill="url(#tg)"/><rect x="-21.8" y="-23.8" width="43.6" height="47.6" rx="10.6" fill="none" stroke="#6ddb73" stroke-width="1.6"/><g stroke="#8aa0c8" stroke-width="1.1" stroke-linecap="round" opacity="0.85"><line x1="0" y1="0" x2="13" y2="0"/><line x1="0" y1="0" x2="6.5" y2="11.26"/><line x1="0" y1="0" x2="-6.5" y2="11.26"/><line x1="0" y1="0" x2="-13" y2="0"/><line x1="0" y1="0" x2="-6.5" y2="-11.26"/><line x1="0" y1="0" x2="6.5" y2="-11.26"/></g><circle cx="13" cy="0" r="2.7" fill="#eceff3"/><circle cx="6.5" cy="11.26" r="2.7" fill="#7aa2ff"/><circle cx="-6.5" cy="11.26" r="2.7" fill="#eceff3"/><circle cx="-13" cy="0" r="2.7" fill="#7aa2ff"/><circle cx="-6.5" cy="-11.26" r="2.7" fill="#eceff3"/><circle cx="6.5" cy="-11.26" r="2.7" fill="#7aa2ff"/><circle cx="0" cy="0" r="4.6" fill="#6ddb73"/></g>
</defs></svg>

<div class="stage dark" id="profile">
  <p class="ses">SES</p><div class="uline"></div><p class="tag">Sysible Enterprise Software</p>
</div>

<!-- The same lockup laid out horizontally, on nothing, for README banners and
     anywhere a wide company mark is wanted. Two colourways because a README is
     read on both themes and GitHub picks with prefers-color-scheme. -->
<div class="stage lockup" id="lockup-dark">
  <p class="ses">SES</p><div class="rule"></div>
  <div class="stack"><p class="l1">Sysible</p><p class="l2">Enterprise&nbsp;Software</p></div>
</div>
<div class="stage lockup" id="lockup-light">
  <p class="ses">SES</p><div class="rule"></div>
  <div class="stack"><p class="l1">Sysible</p><p class="l2">Enterprise&nbsp;Software</p></div>
</div>

<div class="stage dark card" id="sysible-card">
  <span class="bar"></span>
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#m"/></svg>
  <p class="word">Sysible</p><div class="uline"></div><p class="tag">Enterprise Software</p>
</div>

<div class="stage dark card" id="controller-card">
  <span class="bar"></span>
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#mc"/></svg>
  <p class="word">Sysible Controller</p><div class="uline"></div><p class="tag">IT Infrastructure Management</p>
</div>
</body></html>
