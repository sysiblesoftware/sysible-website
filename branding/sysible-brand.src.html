<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#222}
  .stage{position:relative;overflow:hidden;
    font-family:"Liberation Sans","DejaVu Sans","Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .dark{background:radial-gradient(120% 120% at 50% 34%, #141b27 0%, #0d1117 56%, #090c12 100%);}
  .word{font-weight:800;color:#e8eefc;line-height:1;margin:0}
  .tag{font-weight:600;color:#8ea0bd;text-transform:uppercase;margin:0}

  /* profile avatar 1024², padded so it reads small / survives a circle crop */
  #profile{width:1024px;height:1024px}
  #profile .mark{width:322px;height:350px;display:block;margin-bottom:30px}
  #profile .word{font-size:132px;letter-spacing:-2px}
  #profile .tag{font-size:37px;letter-spacing:13px;margin:26px 0 0 13px}

  /* social cards 1280×640 */
  .card{width:1280px;height:640px}
  .card .mark{width:238px;height:258px;display:block;margin-bottom:22px}
  .card .word{font-size:118px;letter-spacing:-2px}
  .card .tag{margin-top:22px}
  #sysible-card .tag{font-size:40px;letter-spacing:16px;margin-left:16px}
  #controller-card .word{font-size:104px}
  #controller-card .tag{font-size:35px;letter-spacing:11px;margin-left:11px}
  .bar{position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,#63c869,#5580ee)}
</style></head><body>

<!-- reusable marks -->
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="sg" x1="-17" y1="-20" x2="17" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#63c869"/><stop offset="1" stop-color="#5580ee"/></linearGradient>
  <linearGradient id="ctl" x1="-12" y1="0" x2="11" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#63c869"/><stop offset="1" stop-color="#5580ee"/></linearGradient>
</defs></svg>

<div class="stage dark" id="profile">
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#m"/></svg>
  <p class="word">Sysible</p><p class="tag">Enterprise Software</p>
</div>

<div class="stage dark card" id="sysible-card">
  <span class="bar"></span>
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#m"/></svg>
  <p class="word">Sysible</p><p class="tag">Enterprise Software</p>
</div>

<div class="stage dark card" id="controller-card">
  <span class="bar"></span>
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#mc"/></svg>
  <p class="word">Sysible Controller</p><p class="tag">IT Infrastructure Management</p>
</div>

<!-- mark path defs -->
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="m">
    <path d="M0,-20 L17,-10 L17,10 L0,20 L-17,10 L-17,-10 Z" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-6.5,-7.5 L1.2,0 L-6.5,7.5" fill="none" stroke="#7aa2ff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="3.2" y="3.6" width="5.6" height="5.6" rx="1" fill="#63c869"/>
  </g>
  <g id="mc">
    <path d="M0,-20 L17,-10 L17,10 L0,20 L-17,10 L-17,-10 Z" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-11,0 L0,0 M0,0 L11,-8 M0,0 L11,8" stroke="url(#ctl)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-11" cy="0" r="3.1" fill="#63c869"/><circle cx="0" cy="0" r="3.3" fill="#57b090"/>
    <circle cx="11" cy="-8" r="3.1" fill="#5580ee"/><circle cx="11" cy="8" r="3.1" fill="#5580ee"/>
  </g>
</defs></svg>
</body></html>
