<!doctype html><html><head><meta charset="utf-8"><style>
  @font-face{font-family:"Sora";font-style:normal;font-weight:100 800;font-display:swap;
    src:url("../fonts/Sora-variable.woff2") format("woff2"),url("../fonts/Sora.ttf") format("truetype");}
  html,body{margin:0;padding:0;background:#222}
  .stage{position:relative;overflow:hidden;
    font-family:"Sora","Liberation Sans","DejaVu Sans","Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .dark{background:radial-gradient(120% 120% at 50% 34%, #141b27 0%, #0d1117 56%, #090c12 100%);}
  .word{font-weight:700;color:#eceff3;line-height:1;margin:0}
  .tag{font-weight:600;color:#8a93a0;text-transform:uppercase;margin:0}
  .uline{height:6px;border-radius:3px;background:#6ddb73;margin:20px 0 0}

  /* profile avatar 1024², padded so it reads small / survives a circle crop */
  #profile{width:1024px;height:1024px}
  #profile .mark{width:330px;height:358px;display:block;margin-bottom:30px}
  #profile .word{font-size:132px;letter-spacing:-2px}
  #profile .uline{width:210px}
  #profile .tag{font-size:37px;letter-spacing:13px;margin:26px 0 0 13px}

  /* social cards 1280×640 */
  .card{width:1280px;height:640px}
  .card .mark{width:238px;height:258px;display:block;margin-bottom:22px}
  .card .word{font-size:118px;letter-spacing:-2px}
  .card .uline{width:200px}
  .card .tag{margin-top:22px}
  #sysible-card .tag{font-size:40px;letter-spacing:16px;margin-left:16px}
  #controller-card .word{font-size:104px}
  #controller-card .uline{width:300px}
  #controller-card .tag{font-size:35px;letter-spacing:11px;margin-left:11px}
  .bar{position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,#6ddb73 0%,#6ddb73 72%,#7aa2ff 100%)}
</style></head><body>

<!-- reusable mark defs (dark tile + green ring; "S" = Sora outline, ctrl = hub-nodes) -->

  <g id="mc"><rect x="-23" y="-25" width="46" height="50" rx="12" fill="url(#tg)"/><rect x="-21.8" y="-23.8" width="43.6" height="47.6" rx="10.6" fill="none" stroke="#6ddb73" stroke-width="1.6"/><g stroke="#8aa0c8" stroke-width="1.1" stroke-linecap="round" opacity="0.85"><line x1="0" y1="0" x2="13" y2="0"/><line x1="0" y1="0" x2="6.5" y2="11.26"/><line x1="0" y1="0" x2="-6.5" y2="11.26"/><line x1="0" y1="0" x2="-13" y2="0"/><line x1="0" y1="0" x2="-6.5" y2="-11.26"/><line x1="0" y1="0" x2="6.5" y2="-11.26"/></g><circle cx="13" cy="0" r="2.7" fill="#eceff3"/><circle cx="6.5" cy="11.26" r="2.7" fill="#7aa2ff"/><circle cx="-6.5" cy="11.26" r="2.7" fill="#eceff3"/><circle cx="-13" cy="0" r="2.7" fill="#7aa2ff"/><circle cx="-6.5" cy="-11.26" r="2.7" fill="#eceff3"/><circle cx="6.5" cy="-11.26" r="2.7" fill="#7aa2ff"/><circle cx="0" cy="0" r="4.6" fill="#6ddb73"/></g>
</defs></svg>

<div class="stage dark" id="profile">
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#m"/></svg>
  <p class="word">Sysible</p><div class="uline"></div><p class="tag">Enterprise Software</p>
</div>

<div class="stage dark card" id="sysible-card">
  <span class="bar"></span>
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#m"/></svg>
  <p class="word">Sysible</p><div class="uline"></div><p class="tag">Enterprise Software</p>
</div>

<div class="stage dark card" id="controller-card">
  <span class="bar"></span>
  <svg class="mark" viewBox="-24 -26 48 52"><use href="#mc"/></svg>
  <p class="word">Sysible Controller</p><div class="uline"></div><p class="tag">IT Infrastructure Management</p>
</div>
</body></html>
