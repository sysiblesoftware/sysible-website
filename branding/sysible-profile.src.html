<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .stage{width:1024px;height:1024px;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 32%, #141b27 0%, #0d1117 55%, #090c12 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Liberation Sans","DejaVu Sans","Helvetica Neue",Arial,sans-serif;}
  .mark{width:420px;height:456px;display:block;margin-bottom:34px}
  .word{font-weight:800;font-size:170px;letter-spacing:-2px;color:#e8eefc;line-height:1;margin:0}
  .tag{font-weight:600;font-size:47px;letter-spacing:18px;color:#8ea0bd;margin:30px 0 0 18px;
    text-transform:uppercase}
</style></head><body>
  <div class="stage" id="stage">
    <svg class="mark" viewBox="-24 -26 48 52" aria-hidden="true">
      <defs><linearGradient id="sg" x1="-17" y1="-20" x2="17" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#63c869"/><stop offset="1" stop-color="#5580ee"/></linearGradient></defs>
      <path d="M0,-20 L17,-10 L17,10 L0,20 L-17,10 L-17,-10 Z" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-6.5,-7.5 L1.2,0 L-6.5,7.5" fill="none" stroke="#7aa2ff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="3.2" y="3.6" width="5.6" height="5.6" rx="1" fill="#63c869"/>
    </svg>
    <p class="word">Sysible</p>
    <p class="tag">Enterprise Software</p>
  </div>
</body></html>
