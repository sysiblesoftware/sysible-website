<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sysible Enterprise Software favicon.
  The company mark is the horizontal SES lockup, but a lockup 6.4 times wider
  than it is tall is unreadable at 16px, which is what a favicon mostly is. So
  the tab carries the distinctive half of it: SES, on the same dark tile with
  the same green ring and rule as the product marks.
  The letterforms are Sora at weight 800, baked to outlines rather than set as
  <text>: an SVG favicon cannot load a web font, so <text> would silently fall
  back to whatever sans the viewer happens to have. Regenerate from
  fonts/Sora.ttf if the wordmark ever changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d29"/><stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tg)"/>
  <rect x="11.2" y="11.2" width="105.6" height="105.6" rx="24.8" fill="none" stroke="#6ddb73" stroke-width="3.4"/>
