<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sysible Flashback is now Sysible Baseline</title>
<!--
  Sysible Flashback was renamed Sysible Baseline. Same product, same data.

  This page stays because the old filename is out in the world: in bookmarks, in
  emails to customers, and linked from the SLOP manual as it was printed. A
  static site has no server-side redirect to give them, so this is the redirect.

  The canonical link tells crawlers where the content went; the meta refresh and
  the script move a real visitor; the prose covers the case where neither fires,
  which is also what someone sees if they open this file from disk.
-->
<link rel="canonical" href="/baseline-manual.html" />
<meta http-equiv="refresh" content="0; url=/baseline-manual.html" />
<style>
  :root { color-scheme: light dark; --fg: #10231c; --bg: #f6f8f7; --accent: #1d9f6c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #e8f0ec; --bg: #0d1512; --accent: #3fd39a; }
  }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); min-height: 100vh;
    display: grid; place-items: center; padding: 16px;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 0.75rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Sysible Flashback is now Sysible Baseline</h1>
  <p>Only the name changed — same product, same console, same config history.</p>
  <p>
    Taking you to the <a href="/baseline-manual.html">Sysible Baseline guide</a>.
    If nothing happens, follow that link.
  </p>
</main>
<script>location.replace("/baseline-manual.html");</script>
</body>
</html>
